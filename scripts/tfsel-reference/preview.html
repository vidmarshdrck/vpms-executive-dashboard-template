<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pms_app timeframe selector</title>
<link rel="stylesheet" href="timeframe.css">
<style>
  /* Preview-only chrome so the header and open panel are fully visible. */
  body{min-height:100vh;background:var(--bg);}
  .preview-note{padding:16px 24px;color:var(--text-muted);font-size:12px;}
</style>
</head>
<body class="hod-view">
  <header class="app-header">
    <div class="hod-header-title">
      <div class="eyebrow">TPPL performance management</div>
      <div class="page-title">Executive Dashboard</div>
    </div>
    <div class="hod-header-context">
      <details class="hod-header-popover hod-timeframe-popover" open>
        <summary aria-label="Select reporting period" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
          <span>Oct – Dec 2026</span>
          <svg class="hod-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </summary>
        <form method="get" class="hod-timeframe-panel" aria-label="Reporting period · Executive Dashboard" onsubmit="event.preventDefault();">
          <p>Reporting period · Executive Dashboard</p>
          <label>From
            <select name="period_from">
              <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
              <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
              <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
              <option value="10" selected>Oct</option><option value="11">Nov</option><option value="12">Dec</option>
            </select>
          </label>
          <label>To
            <select name="period_to">
              <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
              <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
              <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
              <option value="10">Oct</option><option value="11">Nov</option><option value="12" selected>Dec</option>
            </select>
          </label>
          <label>Year
            <select name="period_year">
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
            </select>
          </label>
          <div>
            <button type="button" data-cancel-period>Cancel</button>
            <button type="submit" class="btn btn-primary">Apply</button>
          </div>
        </form>
      </details>
    </div>
  </header>
  <p class="preview-note">Standalone preview of the pms_app header timeframe popover (default current quarter, 10 Nov 2026 → Oct – Dec 2026). Form submit is disabled here.</p>
</body>
</html>
